    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;

        body {

        h1 {

            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        /* Cambio de Flexbox a CSS Grid adaptable */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .team {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .blue {
            border: 2px solid #2a6f97;
        }

        .purple {
            border: 2px solid #8338ec;
        }

        .green {
            border: 2px solid #2a9d8f;
        }

        .team-title {
            color: white;
            padding: 10px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 13px;
        }

        .blue .team-title {
            background: #2a6f97;
        }

        .purple .team-title {
            background: #8338ec;
        }

        .green .team-title {
            background: #2a9d8f;
        }

        /* Permite scroll horizontal en la tabla solo si la pantalla es ultra estrecha */
        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 11px;
        }

        th {
            background: #f8f9fa;
            padding: 6px 4px;
            border-bottom: 1px solid #ddd;
        }

        td {
            padding: 6px 4px;
            text-align: center;
            border-bottom: 1px solid #eee;
        }

        tbody tr:hover {
            background: #fafafa;
        }

        .btn {
            background: #0b2545;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 4px 6px;
            font-size: 10px;
            cursor: pointer;
            font-weight: bold;
            white-space: nowrap;
        }

        .btn:hover {
            background: #1a3a60;
        }

        .wsp-link {
            color: #25D366;
            margin-left: 4px;
            font-size: 14px;
            text-decoration: none;
            transition: transform 0.2s ease, color 0.2s ease;
            display: inline-block;
            vertical-align: middle;
        }

        .wsp-link:hover {
            color: #128C7E;
            transform: scale(1.2);
        }

        .owner .wsp-link,
        .team-title .wsp-link {
            font-size: 16px;
            margin-left: 8px;
        }

        .tech-container {
            display: flex;
            flex-direction: column;
            gap: 2px;
            align-items: center;
            justify-content: center;
        }

        .tech-item {
            white-space: nowrap;
        }

        .footer-action {
            text-align: center;
            margin-top: 30px;
            margin-bottom: 10px;
        }

        .btn-guardia {
            display: inline-block;
            background: #0b2545;
            color: white;
            text-decoration: none;
            padding: 12px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            transition: background 0.2s ease, transform 0.2s ease;
        }

        .btn-guardia:hover {
            background: #1a3a60;
            transform: translateY(-2px);
        }

        /* Fuerza 3 columnas en pantallas medianas/grandes (desktop y laptop) */
        @media (min-width: 1024px) {
            .grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
